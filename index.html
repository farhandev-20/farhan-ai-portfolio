<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Farhan Attar | Conversational AI Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Slow-motion Fluid Background Canvas -->
  <canvas id="fluid" aria-hidden="true"></canvas>

  <div class="page-container" id="page-container">
    <!-- Top Bar Navigation / Controls -->
    <header class="top-bar">
      <div class="brand-badge">
        <span class="pulse-dot"></span>
        <span>Farhan Attar AI</span>
      </div>

      <div class="top-actions">
        <button type="button" id="reset-home-btn" class="top-btn" title="Back to Overview" aria-label="Reset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
          <span class="btn-text">Overview</span>
        </button>

        <div class="top-info">
          <button type="button" id="info-btn" aria-label="About portfolio" class="info-circle">
            <svg class="icon-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="16" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
          </button>
          <div class="tooltip-popover">Conversational AI Portfolio</div>
        </div>
      </div>
    </header>

    <!-- Main Dynamic Content Area -->
    <main class="main-content">
      <!-- 1. HERO OVERVIEW VIEW (Initial State) -->
      <section id="hero-view" class="hero-view active-view">
        <h2 class="hero-greeting">Hey, I'm Farhan 👋</h2>
        <h1 class="hero-title">Computer Engineering Student</h1>

        <!-- Floating 3D Memoji Avatar -->
        <div class="avatar-wrapper">
          <img src="avatar.png" alt="Farhan Attar Avatar" class="hero-avatar" />
        </div>

        <!-- Navigation Cards Grid (6 Cards on initial overview) -->
        <div class="nav-cards-container">
          <button type="button" class="nav-card" data-topic="me">
            <div class="card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                <line x1="9" y1="9" x2="9.01" y2="9"></line>
                <line x1="15" y1="9" x2="15.01" y2="9"></line>
              </svg>
            </div>
            <span class="card-label">Me</span>
          </button>

          <button type="button" class="nav-card" data-topic="projects">
            <div class="card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="14" x="2" y="7" rx="2" ry="2"></rect>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
              </svg>
            </div>
            <span class="card-label">Projects</span>
          </button>

          <button type="button" class="nav-card" data-topic="skills">
            <div class="card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                <polyline points="2 17 12 22 22 17"></polyline>
                <polyline points="2 12 12 17 22 12"></polyline>
              </svg>
            </div>
            <span class="card-label">Skills</span>
          </button>

          <button type="button" class="nav-card" data-topic="contact">
            <div class="card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <span class="card-label">Contact</span>
          </button>

          <button type="button" class="nav-card" data-topic="location">
            <div class="card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
                <circle cx="12" cy="10" r="3"></circle>
              </svg>
            </div>
            <span class="card-label">Location</span>
          </button>

          <button type="button" class="nav-card" data-topic="resume">
            <div class="card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <line x1="10" y1="9" x2="8" y2="9"></line>
              </svg>
            </div>
            <span class="card-label">Resume</span>
          </button>
        </div>
      </section>

      <!-- 2. CONVERSATIONAL CHATBOT VIEW (Active on Click or Query) -->
      <section id="chat-view" class="chat-view hidden-view">
        <!-- Chat Conversation Stream -->
        <div id="chat-stream" class="chat-stream">
          <!-- Messages will be dynamically appended here -->
        </div>
      </section>
    </main>

    <!-- Sticky Bottom Form Area -->
    <footer class="bottom-form-area">
      <!-- Options Bar (Hidden on Overview page, Appears inside Chat View) -->
      <div id="bottom-chips" class="bottom-quick-chips hidden-chips">
        <button type="button" class="chip-pill" data-topic="me">👤 Me</button>
        <button type="button" class="chip-pill" data-topic="projects">💼 Projects</button>
        <button type="button" class="chip-pill" data-topic="skills">⚡ Skills</button>
        <button type="button" class="chip-pill" data-topic="contact">✉️ Contact</button>
        <button type="button" class="chip-pill" data-topic="location">📍 Location</button>
        <button type="button" class="chip-pill" data-topic="resume">📄 Resume</button>
      </div>

      <form id="global-chat-form" class="global-chat-form" autocomplete="off">
        <div class="input-pill">
          <input
            type="text"
            id="chat-input"
            placeholder="Ask me anything..."
            autocomplete="off"
            aria-label="Ask Farhan anything"
          />
          <button type="submit" id="submit-btn" class="pill-send-btn" aria-label="Send message">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>
        </div>
      </form>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
